{% extends "base.html" %}
{% block titulo %}Iniciar sesión{% endblock %}
{% block contenido %}
<div class="tarjeta" style="max-width:380px;margin:60px auto">
  <h1>Iniciar sesión</h1>
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="{{ url_for('login', siguiente=siguiente) }}">
    <input type="hidden" name="_token" value="{{ token }}">
    <label for="usuario">Usuario</label>
    <input type="text" id="usuario" name="usuario" autofocus required>
    <label for="password">Contraseña</label>
    <input type="password" id="password" name="password" required>
    <button class="primario" type="submit">Entrar</button>
  </form>
</div>
{% endblock %}
