{% extends "base.html" %}
{% block titulo %}Panel{% endblock %}
{% block contenido %}
<h1>Panel</h1>
{% if not config_completa %}
<p class="error">Falta capturar los datos de ACL. <a href="{{ url_for('configuracion') }}">Ir a Configuración</a>.</p>
{% endif %}
<div class="tarjeta">
  <h2>Clientes</h2>
  <form method="get" action="{{ url_for('clientes') }}">
    <label for="q">Buscar por nombre o teléfono</label>
    <input type="text" id="q" name="q">
    <button class="primario" type="submit">Buscar</button>
    <a class="boton" href="{{ url_for('cliente_nuevo') }}">Registrar cliente</a>
  </form>
</div>
<p class="nota">Las cotizaciones se agregan en los siguientes incrementos.</p>
{% endblock %}
